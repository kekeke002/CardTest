<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        .question-container { margin: 20px auto; padding: 10px; border: 1px solid #ddd; width: 80%; }
        img { max-width: 100%; height: auto; }
        input { margin-top: 10px; padding: 5px; }
        button { margin-top: 10px; padding: 10px; cursor: pointer; }
        .correct { color: green; }
        .incorrect { color: red; }
    </style>
</head>
<body>

    <h2>Quiz</h2>
    <label for="nameInput">Enter your name:</label>
    <input type="text" id="nameInput" placeholder="Your name" required>

    <form id="quizForm">
        <div id="quizContainer"></div>
        <button type="submit">Submit Answers</button>
    </form>
    
    <h3 id="scoreDisplay"></h3>

    <script>
    const sheetURL = "https://sheets.googleapis.com/v4/spreadsheets/19yB1EuqSYNoa_GkaEpE5BTmpiT-YEKdabuGtmT5DGRs/values/QuestionBank?key=AIzaSyD-t9iAFSFGPFuV2dEqlaDKlv-2Rhh3gko";
    let questions = [];

function seededShuffle(array, seed) {
    let rng = mulberry32(xmur3(seed)());
    let shuffled = array.slice();

    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    return shuffled;
}

// Seed generator
function xmur3(str) {
    for (var i = 0, h = 1779033703 ^ str.length; i < str.length; i++)
        h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
    return function () {
        h = Math.imul(h ^ (h >>> 16), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        return (h ^= h >>> 16) >>> 0;
    };
}

// Random number generator based on seed
function mulberry32(a) {
    return function () {
        var t = (a += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}


    async function fetchQuestions() {
    try {
        const response = await fetch(sheetURL);
        const data = await response.json();

        if (!data.values || data.values.length < 2) {
            throw new Error("No questions found.");
        }

        // Get all valid questions
        const allQuestions = data.values.slice(1)
            .filter(q => q[0] && q[1] && q[3]); // Ensure question, correct answer, image URL are present

        // Get a stable seed for the month (e.g., "2025-04")
        const now = new Date();
        const seed = `${now.getFullYear()}-${(now.getMonth() + 1).toString().padStart(2, '0')}`;

        // Seeded shuffle
        const shuffled = seededShuffle(allQuestions, seed);

        // Take the first 50
        questions = shuffled.slice(0, 50);

        displayQuestions();
    } catch (error) {
        console.error("Error loading questions:", error);
        document.getElementById("quizContainer").innerHTML = "<p>Failed to load questions.</p>";
    }
}


    function displayQuestions() {
        const container = document.getElementById("quizContainer");
        container.innerHTML = "";

        questions.forEach((q, index) => {
            let [questionText, correctAnswer, , imageURL] = q;

            if (imageURL.includes("drive.google.com")) {
                const fileID = imageURL.split("id=")[1];
                imageURL = `https://lh3.googleusercontent.com/d/${fileID}=w500-h300`;
            }

            const questionDiv = document.createElement("div");
            questionDiv.classList.add("question-container");

            questionDiv.innerHTML = ` 
                <img src="${imageURL}" alt="Question Image" onerror="this.onerror=null; this.src='https://via.placeholder.com/300?text=Image+Not+Found';">
                <p>${index + 1}. ${questionText}</p>
                <input type="text" id="answer${index}" data-correct="${correctAnswer.trim()}" placeholder="Your answer">
                <p id="feedback${index}"></p>
            `;

            container.appendChild(questionDiv);
        });
    }

    function generatePDF(name, score, timestamp, responses) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(12);
        doc.text("Quiz Results", 10, 10);
        doc.setFontSize(10);
        doc.text(`Name: ${name}`, 10, 20);
        doc.text(`Score: ${score} / 50`, 10, 25);
        doc.text(`Timestamp: ${timestamp}`, 10, 30);

        let y = 40;  
        let xLeft = 10;  
        let xRight = 110; 

        // First Page: Questions 1-24
        for (let i = 0; i < 12; i++) {
            if (i >= responses.length) break;

            let responseLeft = responses[i];
            let responseRight = responses[i + 12];

            doc.setTextColor(0, 0, 0);
            doc.text(`${i + 1}. ${responseLeft.question}`, xLeft, y);
            doc.setTextColor(responseLeft.isCorrect ? 0 : 255, responseLeft.isCorrect ? 128 : 0, 0);
            doc.text(`Your Answer: ${responseLeft.userAnswer}`, xLeft, y + 5);
            doc.setTextColor(0, 0, 0);
            doc.text(`Correct Answer: ${responseLeft.correctAnswer}`, xLeft, y + 10);

            if (responseRight) {
                doc.setTextColor(0, 0, 0);
                doc.text(`${i + 13}. ${responseRight.question}`, xRight, y);
                doc.setTextColor(responseRight.isCorrect ? 0 : 255, responseRight.isCorrect ? 128 : 0, 0);
                doc.text(`Your Answer: ${responseRight.userAnswer}`, xRight, y + 5);
                doc.setTextColor(0, 0, 0);
                doc.text(`Correct Answer: ${responseRight.correctAnswer}`, xRight, y + 10);
            }

            y += 20;
        }

        // New Page for Questions 25-50
        doc.addPage();
        y = 10;

        for (let i = 24; i < 37; i++) {
            if (i >= responses.length) break;

            let responseLeft = responses[i];
            let responseRight = responses[i + 13];

            doc.setTextColor(0, 0, 0);
            doc.text(`${i + 1}. ${responseLeft.question}`, xLeft, y);
            doc.setTextColor(responseLeft.isCorrect ? 0 : 255, responseLeft.isCorrect ? 128 : 0, 0);
            doc.text(`Your Answer: ${responseLeft.userAnswer}`, xLeft, y + 5);
            doc.setTextColor(0, 0, 0);
            doc.text(`Correct Answer: ${responseLeft.correctAnswer}`, xLeft, y + 10);

            if (responseRight) {
                doc.setTextColor(0, 0, 0);
                doc.text(`${i + 14}. ${responseRight.question}`, xRight, y);
                doc.setTextColor(responseRight.isCorrect ? 0 : 255, responseRight.isCorrect ? 128 : 0, 0);
                doc.text(`Your Answer: ${responseRight.userAnswer}`, xRight, y + 5);
                doc.setTextColor(0, 0, 0);
                doc.text(`Correct Answer: ${responseRight.correctAnswer}`, xRight, y + 10);
            }

            y += 20;
        }

        doc.save(`${name}_Quiz_Results_${timestamp}.pdf`);
    }

    document.getElementById("quizForm").addEventListener("submit", function(event) {
        event.preventDefault();

        let name = document.getElementById("nameInput").value.trim();
        if (!name) {
            alert("Please enter your name before submitting.");
            return;
        }

        let score = 0;
        let responses = [];
        let timestamp = new Date().toLocaleString('en-GB', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
        });

        questions.forEach((q, index) => {
            const userAnswer = document.getElementById(`answer${index}`).value.trim();
            const correctAnswer = document.getElementById(`answer${index}`).getAttribute("data-correct");
            const feedback = document.getElementById(`feedback${index}`);

            let isCorrect = userAnswer.toLowerCase() === correctAnswer.toLowerCase();

            if (isCorrect) {
                score++;
                feedback.innerHTML = `Correct Answer: ${correctAnswer}`;
                feedback.className = "correct";
            } else {
                feedback.innerHTML = `Correct Answer: ${correctAnswer}`;
                feedback.className = "incorrect";
            }

            responses.push({
                question: questions[index][0],  // Using the question from column A
                userAnswer,
                correctAnswer,
                isCorrect
            });
        });

        document.getElementById("scoreDisplay").textContent = `${name}, Your Score: ${score} / 50`;
        alert("✅ Submitted Successfully!");

        // Send data to Google Apps Script
        const url = `https://script.google.com/macros/s/AKfycbzlL-QbVKYy-46QUvsg5xfVvcTLGYUNtqupnwP1LF2_AbN_wI31v4cuIK1I3ckOBKkXSw/exec?name=${encodeURIComponent(name)}&score=${score}&timestamp=${encodeURIComponent(timestamp)}`;
        fetch(url)
            .then(response => response.text())
            .then(data => {
                console.log(data);
                alert("✅ Your quiz results have been saved!");
                
                // Generate PDF
                generatePDF(name, score, timestamp, responses);
            })
            .catch(error => {
                console.error("Error sending data:", error);
                alert("❌ There was an error submitting your results.");
            });
    });

    fetchQuestions();  // Load questions when the page loads
    </script>

</body>
</html>
